<meta property="og:title" content="Lalitha Event Decors"><meta property="og:description" content="Event decorators since 1985 · Visiting card">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2e9e4;--fg:#2a1a1a;--mut:#7a6660;--acc:#d9161c;--gold:#9a7a1c;--card:#ffffff99;--line:#ffffffc0;--btn:#ffffffd9;--body:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--body);min-height:100vh;overflow-x:hidden}
body.royal{--bg:#4a060b;--fg:#fff4e0;--mut:#e7c9a8;--card:#ffffff14;--line:#e9c46a55;--btn:#ffffff1a;--acc:#e9c46a;--gold:#e9c46a;background:radial-gradient(circle at 50% 15%,#8e0f16,#3a0408 70%)}
body.classic{--bg:#fbf6ee;--card:#fff;--line:#eadfce;--btn:#fbf6ee}
body.dark{--bg:#0d0d0d;--fg:#f4efe6;--mut:#b9b0a2;--card:#ffffff0d;--line:#c9a24a44;--btn:#ffffff12;--acc:#e9c46a;--gold:#c9a24a}
.bl{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none}
.b1{width:70vmax;height:50vmax;background:#ff6b6b;top:-22vmax;left:-25vmax;animation:dr 6s ease-in-out infinite alternate}
.b2{width:70vmax;height:50vmax;background:#f7b733;bottom:-22vmax;right:-28vmax;animation:dr 7s ease-in-out infinite alternate-reverse}
body.royal .b1{background:#a1121c}body.royal .b2{background:#7a4a0a}body.classic .bl,body.dark .bl{display:none}
@keyframes dr{to{transform:translate(4vmax,3vmax) scale(1.1)}}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .5s,visibility .5s}
body.royal #intro{background:#4a060b}#intro.done{opacity:0;visibility:hidden}
#intro .m{width:min(36vw,150px);animation:spin 1.1s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 14px 20px #0003)}#intro .t{width:min(56vw,230px);animation:up .6s .5s both}
@keyframes spin{0%{opacity:0;transform:perspective(600px) rotateY(-90deg) rotateZ(-90deg) scale(.4)}100%{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:up .5s ease-out both}
.hd{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px 14px}.hd>div{display:flex;flex-direction:column;align-items:center}.hd .m{width:64px;flex:none;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px #0003)}
.hd .t{height:74px;width:auto;max-width:100%;display:block;margin:0 auto}.tl{display:inline-block}body.royal .hd .tl,body.dark .hd .tl{background:#fff;border-radius:10px;padding:4px 8px}
.hd .who{font-size:12px;color:var(--mut);margin-top:2px}.hd .who b{color:var(--fg)}
@keyframes fl{50%{transform:translateY(-3px) rotate(3deg)}}
.greet{font-size:14px}.greet b{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{font-size:12px;padding:4px 9px;border-radius:14px;background:var(--btn);border:1px solid var(--line)}.chips span i{font-style:normal;color:var(--mut);margin-right:4px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}
.acts a,.acts button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:14px;background:var(--btn);border:1px solid var(--line);color:var(--fg);text-decoration:none;font:600 11px var(--body);cursor:pointer;transition:transform .15s}
.acts a:active,.acts button:active{transform:scale(.94)}.acts i{font-style:normal;font-size:19px;line-height:1.1}
.acts .call{background:var(--acc);color:#fff;border-color:var(--acc)}.acts .wa{background:#25d366;color:#fff;border-color:#25d366}.acts .ig{background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4);color:#fff;border:0}.acts .hl{background:var(--fg);color:var(--bg);border-color:var(--fg)}
body.royal .acts .call,body.dark .acts .call{color:#2a1a0a}
h3{margin:0 0 6px;font:800 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sv{display:flex;flex-wrap:wrap;gap:5px}.sv span{padding:4px 9px;border-radius:14px;background:var(--btn);border:1px solid var(--line);font-size:12px}
.gal{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}.gal img{width:92px;height:92px;object-fit:cover;border-radius:10px;flex:none}
details.ab summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between}details.ab summary::-webkit-details-marker{display:none}details.ab summary::after{content:"+";color:var(--mut)}details.ab[open] summary::after{content:"–"}.ab p{margin:6px 0 0;white-space:pre-line;font-size:13px}
.ln{font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:2px}.ln a{color:inherit}
.bot{display:flex;gap:8px}.bot a,.bot button{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--fg);font:700 12.5px var(--body);text-decoration:none;cursor:pointer}.bot .sv2{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* halls sheet */
#hs{position:fixed;inset:0;z-index:20;background:#0007;display:flex;align-items:flex-end;justify-content:center}#hs[hidden]{display:none}
.sh{background:var(--bg);color:var(--fg);width:min(460px,100%);max-height:86vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:sl .3s ease-out;padding-bottom:env(safe-area-inset-bottom)}body.royal .sh{background:#3a0408}
@keyframes sl{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.shh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.shh b{font-size:15px}.shh button{border:0;background:var(--btn);color:var(--fg);border-radius:50%;width:30px;height:30px;font-size:15px;cursor:pointer}
.shb{overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.hall{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.hall summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;list-style:none}.hall summary::-webkit-details-marker{display:none}
.hall summary b{font-size:14px}.hall summary span{font-weight:800;color:var(--acc);white-space:nowrap;font-size:13px}
.hg{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:8px;font-size:12.5px}.hg dt{color:var(--mut)}.hg dd{margin:0;font-weight:600}
.am{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.am span{font-size:11.5px;padding:3px 8px;border-radius:12px;background:var(--btn);border:1px solid var(--line)}
.hn{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--acc)}
.hall .hb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.hall .dl{border:0;background:var(--fg);color:var(--bg);font:700 12px var(--body);padding:7px 12px;border-radius:10px;cursor:pointer}
.hall .mp{display:inline-block;font-size:12px;font-weight:700;color:var(--acc);text-decoration:none}
.err{color:var(--mut);text-align:center;font-size:13px}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.fxb{position:fixed;width:40vmax;height:32vmax;border-radius:50%;background:#d9161c;opacity:.18;filter:blur(90px);top:35%;left:30%;z-index:0;pointer-events:none;animation:fxb 13s ease-in-out infinite alternate}
@keyframes fxb{0%{transform:translate(-6vmax,-4vmax) scale(.9)}100%{transform:translate(8vmax,6vmax) scale(1.15)}}
@media print{#fx,.fxb{display:none!important}}
main{z-index:1}
</style></head><body class="glass"><i class="bl b1"></i><i class="bl b2"></i>
